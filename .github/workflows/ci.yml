name: CI

on:
    push:
        branches: [main, production]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Hardhat / ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Instalar Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar CI
              shell: bash
              run: npm run ci
