name: CI

on:
    push:
    pull_request:

jobs:
    hardhat:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: bash scripts/ci.sh
