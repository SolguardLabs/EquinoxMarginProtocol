name: Release Integrity

on:
    push:
        branches: [main, production]
        tags: ["v*"]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Código y promoción
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout del objeto publicado
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

            - name: Instalar Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Ejecutar verificación completa
              run: npm run ci

            - name: Verificar cadena de promoción
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  REF_NAME: ${{ github.ref_name }}
                  REF_TYPE: ${{ github.ref_type }}
              run: |
                  git fetch origin main --tags --force

                  if [[ "$REF_NAME" == "production" ]]; then
                    [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
                  fi

                  if [[ "$REF_TYPE" == "tag" || "$EVENT_NAME" == "release" ]]; then
                    tag_name="${RELEASE_TAG:-$REF_NAME}"
                    git fetch origin production
                    [[ "$(git cat-file -t "$tag_name")" == "tag" ]]
                    [[ "$(git rev-parse "$tag_name^{}")" == "$(git rev-parse origin/production)" ]]
                  fi
